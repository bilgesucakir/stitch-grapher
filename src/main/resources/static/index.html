<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stitch Grapher</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="app-title">🧵 Stitch Grapher</div>
  <a class="github-link" href="https://github.com/bilgesucakir/stitch-grapher" target="_blank">
    GitHub repo
  </a>
</div>

<!-- Main layout -->
<div class="app-container">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar">

    <div class="section">
      <select id="crochet-mode">
        <option value="FLAT">Flat Mode</option>
        <option value="CIRCULAR">Circular Mode</option>
      </select>
    </div>

    <div class="section">
      <div id="rows-container"></div>
    </div>

    <div id="error-box" class="hidden"></div>

    <div class="section buttons">
      <button id="add-row-btn">+ Add Row</button>
      <button id="generate-graph-btn" class="primary-btn">
        Generate
      </button>
    </div>

  </div>

  <!-- RIGHT CONTENT -->
  <div class="main-view">
    <div id="cy"></div>
  </div>

</div>

</body>

</html>
